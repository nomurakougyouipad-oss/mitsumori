<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>見積</title>
<meta name="description" content="よつば建設工業 社内向け 見積アプリ">
<meta name="theme-color" content="#1B3A5C">
<!-- iPhone「ホーム画面に追加」用: アイコン・表示名・全画面起動 -->
<meta name="apple-mobile-web-app-title" content="見積">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
<style>
  /* 起動画面（スプラッシュ）のスタイルはインライン化してある。
     外部CSSの読み込みを待たずに1フレーム目から正しく表示するため
     （PWA起動直後の白いちらつき対策）。app.css側には置かないこと。 */
  html, body { margin: 0; background: #fff; }
  #splash {
    position: fixed; inset: 0; z-index: 999;
    display: flex; align-items: center; justify-content: center;
    background: #fff;
    opacity: 1;
    transition: opacity .45s ease-in;
  }
  #splash .splash-logo {
    width: min(45vw, 300px); height: auto; display: block;
    transform: scale(1);
    transform-origin: center center;
    will-change: transform, opacity;
    transition: transform .45s ease-in;
  }
  #splash.splash-hide { opacity: 0; pointer-events: none; }
  #splash.splash-hide .splash-logo { transform: scale(8); }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<link rel="stylesheet" href="./app.css?v=12">
</head>
<body class="has-tabbar">
<!-- 起動画面（スプラッシュ）: QUOTEワードマーク（濃紺）をSVGで描画。
     読み込み完了後、ズームインしながらフェードアウト（最低0.8秒表示） -->
<div id="splash" aria-hidden="true">
  <svg class="splash-logo" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
    <text x="100" y="38" text-anchor="middle" fill="#1B3A5C" font-size="34" font-weight="700"
      letter-spacing="3" font-family="'IBM Plex Mono', ui-monospace, monospace">QUOTE</text>
    <rect x="22" y="48" width="156" height="5" fill="#1B3A5C"/>
  </svg>
</div>
<script>
  // 保険: 万一アプリ側の処理が走らなくても、起動画面のまま固まらないようにする
  setTimeout(function () {
    var s = document.getElementById('splash');
    if (s) { s.classList.add('splash-hide'); setTimeout(function () { s.remove(); }, 500); }
  }, 10000);
  // iOS Safari はビューポート設定(user-scalable=no)を無視することがあるため、
  // ジェスチャーイベントを止めてページ全体のピンチズームを抑止する。
  // （スケッチ写真ビューアの拡大は独自実装のため影響なし）
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
</script>
<div id="app">
  <div style="padding:48px 24px;text-align:center;font-size:14px;opacity:.7">読み込み中…</div>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script type="module" src="./js/app.js?v=12"></script>
<script>
  // PWA: Service Worker 登録（ローカルファイル直開きでは無効）
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
