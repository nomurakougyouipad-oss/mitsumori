<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TP-A 単価を聞く順番（開発用）</title>
<style>
body{font:13px/1.7 system-ui;margin:16px;color:#22303C}
h1{font-size:18px} h2{font-size:15px;margin:22px 0 6px;border-bottom:2px solid #ccd;padding-bottom:3px}
table{border-collapse:collapse;font-size:12.5px;margin:8px 0}
th,td{border:1px solid #ccc;padding:4px 8px;text-align:left;white-space:nowrap}
th{background:#eef2f6}
.num{font-family:Consolas,monospace;text-align:right}
.stop{color:#B00;font-weight:700}
.small{font-size:11.5px;color:#666}
tr.hi{background:#FFF3F3}
pre{background:#f6f8fa;padding:8px;overflow:auto;font-size:11px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>TP-A 単価を聞く順番</h1>
<p class="small"><b>読み取りだけ。何も書き換えない。</b><br>
使用停止にした行・見積での使用・納品書 材料集計表での購入実績を、呼び径ごとに突き合わせる。</p>
<div id="out">読み込み中…</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module">
import { cache, startSubscriptions } from '../js/store.js?v=30';
import { parseSheet } from '../js/screen-tally.js?v=30';

const esc = (x) => String(x ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
// 「買える行が無い」は決め打ちにせず、実データ（停止していない行が0か）で判定する。
// 材質ごとに見ないと取りこぼす（SUS304の15Aは買えるが、SUS316Lの15Aは買えない）
const noBuy = (o) => o.live === 0;

startSubscriptions();
for (let i = 0; i < 120 && !cache.itemsLoaded; i++) await new Promise((r) => setTimeout(r, 500));
for (let i = 0; i < 60 && typeof XLSX?.read !== 'function'; i++) await new Promise((r) => setTimeout(r, 300));

// 見積の明細（呼び径ごとの使用実績用）。
// 明細は estimates/{id}/lines のサブコレクションで、購読キャッシュには載っていないため
// scratchpad の fs_dump_lines.ps1 で書き出したものを置いて読む。
// 無ければ「見積での使用0」として続ける（この画面は読み取り専用の集計なので止めない）
const lines = await fetch('../tmp-est-lines.json').then((r) => (r.ok ? r.json() : [])).catch(() => []);
const sheet = parseSheet(XLSX, await (await fetch('../tally-test.xlsx')).arrayBuffer());
const jis = await (await fetch('./jis-sizes.source.json')).json();

// 集計表は業者の書き方＝外径で来る（「34×3×4000」は外径34mm＝25A）。
// 呼び径が書いていなければ、先頭の外径から引き当てる
const odToNom = new Map();
for (const r of [...jis['SGP'], ...jis['TP-A']]) odToNom.set(Number(r['外径']), String(r['呼び径']).replace('A', ''));
const nomOf = (s) => {
  const t = String(s || '');
  const a = /(\d+)A/.exec(t);
  if (a) return a[1];
  const od = /^\s*(\d+(?:\.\d+)?)\s*[x×]/.exec(t);
  if (od && odToNom.has(Number(od[1]))) return odToNom.get(Number(od[1]));
  return null;
};
const isTPA = (s) => /TP-?A/i.test(String(s || ''));

// ---- 1) 使用停止のTP-Aを呼び径×材質でまとめる ----
const g = new Map();   // 呼び径|材質
const put = (nom, mat, f) => {
  const k = nom + '|' + mat;
  if (!g.has(k)) g.set(k, { nom, mat, stopped: 0, use: 0, live: 0, ests: new Set(), last: '', sheetRows: 0, sheetQty: 0 });
  f(g.get(k));
};
for (const it of cache.items) {
  if (!/^TP-A/.test(it.name)) continue;
  const nom = nomOf(it.name); if (!nom) continue;
  const mat = (it.name.match(/\((SUS[^)]*)\)/) || [])[1] || it.material || '—';
  put(nom, mat, (o) => {
    if (it.discontinued) { o.stopped++; o.use += (it.useCount || 0); }
    else o.live++;
    if (it.updatedAtRaw && it.updatedAtRaw > o.last) o.last = it.updatedAtRaw;
  });
}
// ---- 見積での使用（明細の品名から呼び径を拾う） ----
for (const l of (Array.isArray(lines) ? lines : [])) {
  if (!isTPA(l.name)) continue;
  const nom = nomOf(l.name); if (!nom) continue;
  const mat = (String(l.name).match(/\((SUS[^)]*)\)/) || [])[1] || '—';
  put(nom, mat, (o) => o.ests.add(l.est));
}
// ---- 3) 集計表（納品書 材料集計表）での実購入 ----
const sheetByNom = new Map();
const sheetTPA = [];
for (const r of sheet) {
  const txt = [r.name, r.material, r.spec].join(' ');
  if (!isTPA(txt)) continue;
  const nom = nomOf(r.spec) || nomOf(r.name);
  sheetTPA.push({ ...r, nom });
  if (!nom) continue;
  const cur = sheetByNom.get(nom) || { rows: 0, qty: 0 };
  cur.rows++; cur.qty += (typeof r.qty === 'number' ? r.qty : 0);
  sheetByNom.set(nom, cur);
}
for (const o of g.values()) {
  const s = sheetByNom.get(o.nom);
  if (s) { o.sheetRows = s.rows; o.sheetQty = s.qty; }
}

// ---- 4) 優先順位 ----
// 買えなくなったサイズを最優先。次に集計表での購入実績、見積での使用、停止行数
const rows = [...g.values()].filter((o) => o.stopped > 0);
const score = (o) => (noBuy(o) ? 1000 : 0) + o.sheetRows * 50 + o.ests.size * 20
  + o.use * 10 + o.stopped + (o.mat !== 'SUS304' ? 5 : 0);
rows.sort((a, b) => score(b) - score(a) || Number(a.nom) - Number(b.nom));

const out = document.getElementById('out');
out.innerHTML = `
<h2>単価を聞く順番</h2>
<table>
<tr><th>順</th><th>呼び径</th><th>材質</th><th>買える行</th><th>停止した行数</th>
    <th>useCount合計</th><th>見積の件数</th><th>集計表の行数</th><th>集計表の数量</th><th>単価の更新日</th></tr>
${rows.map((o, i) => `<tr class="${noBuy(o) ? 'hi' : ''}">
  <td class="num">${i + 1}</td>
  <td class="num">${o.nom}A</td>
  <td>${esc(o.mat)}</td>
  <td class="${o.live ? '' : 'stop'}">${o.live ? o.live + '件' : '★ 無し'}</td>
  <td class="num">${o.stopped}</td>
  <td class="num">${o.use}</td>
  <td class="num">${o.ests.size}${o.ests.size ? `<span class="small">（${esc([...o.ests].join('／'))}）</span>` : ''}</td>
  <td class="num">${o.sheetRows}</td>
  <td class="num">${o.sheetQty || ''}</td>
  <td>${esc(o.last || '—')}</td>
</tr>`).join('')}
</table>
<p class="small">★ = 買える行が無くなったサイズ（停止した行しか無い）。この4つは単価が入るまで単価待ちになる。</p>

<h2>集計表（納品書 材料集計表）のTP-A該当行</h2>
<p class="small">読み込んだのは7月分の1ファイルのみ（${sheet.length}行）。
過去分がこれしか無いため、購入頻度としては1か月分の目安。</p>
<pre>${sheetTPA.length
  ? esc(sheetTPA.map((r) => `行${r.r} [${r.orderNo}] ${r.name}｜${r.material}｜${r.spec}　数量${r.qty}${r.unit}　${r.price ? '@' + r.price : ''}`).join('\n'))
  : '（TP-Aに該当する行は見つからなかった）'}</pre>

<h2>貼り付け用（TSV）</h2>
<pre id="tsv">${esc(['順\t呼び径\t材質\t買える行\t停止した行数\tuseCount合計\t見積の件数\t工事名\t集計表の行数\t集計表の数量\t単価の更新日',
  ...rows.map((o, i) => [i + 1, o.nom + 'A', o.mat, o.live ? o.live : '無し', o.stopped, o.use,
    o.ests.size, [...o.ests].join('／'), o.sheetRows, o.sheetQty || '', o.last || ''].join('\t'))].join('\n'))}</pre>`;

window.__tpa = { rows, sheetTPA, sheetTotal: sheet.length };
</script>
</body>
</html>
