<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>重量がおかしい行の洗い出し（開発用）</title>
<style>
body{font:13px/1.7 system-ui;margin:16px;color:#22303C}
h1{font-size:18px} h2{font-size:15px;margin:22px 0 6px;border-bottom:2px solid #ccd;padding-bottom:3px}
table{border-collapse:collapse;font-size:12.5px;margin:8px 0}
th,td{border:1px solid #ccc;padding:4px 8px;text-align:left;white-space:nowrap}
th{background:#eef2f6}
.num{font-family:Consolas,monospace;text-align:right}
.hit{color:#B00;font-weight:700}
tr.live{background:#FFF3F3}
.small{font-size:11.5px;color:#666}
pre{background:#f6f8fa;padding:8px;overflow:auto;font-size:11px;max-height:340px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>重量がおかしい行の洗い出し</h1>
<p class="small"><b>読み取りだけ。何も書き換えない。</b><br>
kgPrice を持つ行について、品名から規格を読み取り、JIS表の理論重量と比べる。
JIS表に無い規格（STPGのSch40/80等）は、同じ規格の他社の行と比べる。</p>
<div id="out">読み込み中…</div>
<script type="module">
import { cache, startSubscriptions } from '../js/store.js?v=29';
import { parseItemName } from '../js/catalog.js?v=29';

const esc = (x) => String(x ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const han = (x) => String(x).replace(/[Ａ-Ｚａ-ｚ０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
const N = (s) => (String(s).match(/\d+(?:\.\d+)?/g) || []).map(Number);

startSubscriptions();
for (let i = 0; i < 120 && !cache.itemsLoaded; i++) await new Promise((r) => setTimeout(r, 500));
const jis = await (await fetch('./jis-sizes.source.json')).json();
const lines = await fetch('../tmp-est-lines.json').then((r) => (r.ok ? r.json() : [])).catch(() => []);
const useOf = (it) => new Set(lines.filter((l) => l.itemId === it.id || l.name === it.name).map((l) => l.est)).size;

// ---- 密度（g/cm3）。分からない材質は判定しない ----
const RHO = { SS400: 7.85, SUS304: 7.93, SUS304W: 7.93, SUS316: 7.98, SUS316L: 7.98,
  SUS316LW: 7.98, SUSF316L: 7.98, A5052: 2.68, ｱﾙﾐ: 2.68 };
const rhoOf = (mat, name) => {
  if (RHO[mat] != null) return RHO[mat];
  if (/SUS31[68]/.test(mat + name)) return 7.98;
  if (/SUS/.test(mat + name)) return 7.93;
  if (/ｱﾙﾐ|A5052|A6063/.test(mat + name)) return 2.68;
  if (/SS400|STKR|STK|SGP|STPG|STPT|SPCC|S45C|STKM|SPHC/.test(mat + name)) return 7.85;
  return null;
};
// ---- JIS表を引きやすい形に ----
const idx = (arr, keyFn) => { const m = new Map(); for (const r of arr) m.set(keyFn(r), r); return m; };
const J = {
  angle: idx(jis['アングル'], (r) => N(r['寸法']).join('x')),
  channel: idx(jis['溝形鋼'], (r) => N(r['寸法']).join('x')),
  hbeam: idx(jis['H形鋼'], (r) => N(r['寸法']).join('x')),
  fb: idx(jis['平鋼'], (r) => N(r['寸法']).join('x')),
  round: idx(jis['丸棒'], (r) => N(r['寸法']).join('x')),
  sqpipe: idx(jis['角パイプ'], (r) => N(r['寸法']).join('x')),
  plate: idx(jis['平板'], (r) => String(r['厚'])),
  sgp: idx(jis['SGP'], (r) => String(r['呼び径']).replace('A', '')),
  tpa: idx(jis['TP-A'], (r) => String(r['呼び径']).replace('A', '') + '|' + String(r['Sch']).replace('S', '')),
};
const sgpOd = new Map(jis['SGP'].map((r) => [String(r['呼び径']).replace('A', ''), r['外径']]));

// ---- 長さ（m）を読む ----
function lengthM(dims) {
  const d = han(dims).replace(/定尺/g, '');
  const m1 = /x\s*([\d.]+)\s*m\b/.exec(d);
  if (m1) return Number(m1[1]);
  const m2 = /x\s*(\d{2,})(?!\s*A)\s*$/.exec(d) || /L\s*=\s*(\d+)/.exec(d);
  if (m2) return Number(m2[1]) / 1000;
  return null;
}
// ---- 理論重量（kg/本）。出せなければ null ----
function theory(it) {
  const p = parseItemName(it.name);
  const d = han(p.dims);
  const nums = N(d);
  const rho = rhoOf(p.material || '', it.name);
  const L = lengthM(p.dims);
  const scale = rho != null ? rho / 7.85 : 1;      // JIS表は鋼(7.85)基準
  const kgm = (v) => (v == null ? null : v * scale);
  const head = p.head;

  if (head === 'ｱﾝｸﾞﾙ' && nums.length >= 4 && L) {
    const r = J.angle.get(nums.slice(0, 3).join('x'));
    return r ? { w: kgm(r['kg/m']) * L, how: 'JIS アングル' } : null;
  }
  if (head === '溝形鋼' && nums.length >= 4 && L) {
    const r = J.channel.get(nums.slice(0, 3).join('x'));
    return r ? { w: kgm(r['kg/m']) * L, how: 'JIS 溝形鋼' } : null;
  }
  if (head === 'H形鋼' && nums.length >= 5 && L) {
    const r = J.hbeam.get(nums.slice(0, 4).join('x'));
    return r ? { w: kgm(r['kg/m']) * L, how: 'JIS H形鋼' } : null;
  }
  if ((head === '平鋼' || head === 'FBH') && nums.length >= 3 && L && rho) {
    return { w: nums[0] * nums[1] * (L * 1000) * rho / 1e6, how: '板厚x幅x長さx比重' };
  }
  if (head === '丸棒' && nums.length >= 2 && L && rho) {
    return { w: Math.PI / 4 * nums[0] ** 2 * (L * 1000) * rho / 1e6, how: 'π/4·d²·長さ·比重' };
  }
  if (/角ﾊﾟｲﾌﾟ/.test(head) && nums.length >= 4 && L) {
    const r = J.sqpipe.get(nums.slice(0, 3).join('x'));
    if (r) return { w: kgm(r['kg/m']) * L, how: 'JIS 角パイプ' };
    // 桁の順が2通りある（□-2.3x50x50 は 板厚,辺,辺 ／ □-200x100x6 は 辺,辺,板厚）。
    // 一番小さい数字を板厚とみなす
    if (rho) {
      const three = nums.slice(0, 3).slice().sort((a, b) => a - b);
      const t = three[0], a = three[1], b = three[2];
      if (t >= a) return null;
      return { w: 2 * t * ((a - t) + (b - t)) * (L * 1000) * rho / 1e6, how: '角管の断面x長さx比重（角のRは見ていない）' };
    }
    return null;
  }
  if ((head === '平板' || head === 'ﾁｪｯｶｰﾌﾟﾚｰﾄ') && rho) {
    // 「平板 2B(SUS304) PL-1.0x1mx2m」のように、仕上げ(2B)や材質(SUS304)が
    // 寸法側に紛れている品名がある。そのまま数字を拾うと 2 や 304 を寸法と読む。
    // 寸法らしい塊（数字xの並び）だけを取り出す
    const body = d.replace(/[(（][^)）]*[)）]/g, ' ')          // かっこの中を落とす
      .split(/\s+/).map((t) => t.replace(/^[A-Za-z]+-/, ''))   // PL- / CPL- を外す
      .filter((t) => /^[\d.]+(\s*m)?(x[\d.]+(\s*m)?){2,}/i.test(t))
      .pop();
    if (!body) return null;
    // 「1mx2m」はメートル。「3mm」は m の後ろに m が続くので換算しない
    const mm = N(body.replace(/([\d.]+)\s*m(?!m)/gi, (_, v) => String(Number(v) * 1000)))
      .filter((v) => isFinite(v) && v > 0);
    if (mm.length < 3) return null;
    const [t, w, l] = mm;
    if (t > 100) return null;                       // 板厚が3桁は読み違い
    return { w: t * w * l * rho / 1e6, how: '厚x幅x長さx比重（m表記はmmに換算）' };
  }
  if (head === '丸ﾊﾟｲﾌﾟ' && nums.length >= 3 && L && rho) {
    const [D, t] = nums;
    return { w: Math.PI * (D - t) * t * rho / 1000 * L, how: 'π(D−t)t·長さ·比重' };
  }
  if (head === 'SGP' && L) {
    const nom = (/(\d+)A/.exec(d) || [])[1];
    const r = nom ? J.sgp.get(nom) : null;
    return r ? { w: kgm(r['kg/m']) * L, how: 'JIS SGP' } : null;
  }
  if (head === 'TP-A' && L) {
    const nom = (/(\d+)A/.exec(d) || [])[1];
    const mm = (/x([\d.]+)mm/.exec(d) || [])[1];
    const sch = (/s(\d+)/i.exec(d) || [])[1];
    if (nom && sch && J.tpa.get(nom + '|' + sch)) return { w: J.tpa.get(nom + '|' + sch)['kg/m'] * (rho ? rho / 7.93 : 1) * L, how: 'JIS TP-A' };
    if (nom && mm && sgpOd.has(nom) && rho) {
      const D = sgpOd.get(nom), t = Number(mm);
      return { w: Math.PI * (D - t) * t * rho / 1000 * L, how: 'π(D−t)t·長さ·比重' };
    }
    return null;
  }
  return null;
}

// ---- 同じ規格の他社の行と比べる（JIS表に無い規格の受け皿） ----
// 材質記号＋呼び径＋Sch＋長さ が同じ行の kg/m の中央値と比べる
function peerKey(it) {
  const n = han(it.name);
  let mat = null;
  if (/^STPG370/.test(n)) mat = 'STPG370';
  else if (/^STPT370/.test(n)) mat = 'STPT370';
  else if (/^STK[^M]/.test(n)) mat = 'STK';
  if (!mat) return null;
  const nom = (/(\d+)A/.exec(n) || [])[1];
  const sch = (/s(\d+)/i.exec(n) || [])[1] || '-';
  const L = lengthM(parseItemName(it.name).dims);
  return nom && L ? `${mat}|${nom}A|s${sch}|${L}` : null;
}
// 比べる相手には停止済みの行を入れない。
// 停止した行が間違っている（菅機械の90kg）ので、それを基準にすると
// 正しい側（小野建の18kg）が「おかしい」と出てしまう
const peers = new Map();
for (const it of cache.items) {
  if (typeof it.weight !== 'number' || !it.weight) continue;
  if (it.discontinued) continue;
  const k = peerKey(it); if (!k) continue;
  if (!peers.has(k)) peers.set(k, []);
  peers.get(k).push(it);
}

// ---- 判定 ----
const target = cache.items.filter((x) => x.kgPrice != null);
const rows = [], undecidable = [];
for (const it of target) {
  const w = typeof it.weight === 'number' ? it.weight : null;
  let th = theory(it), how = th ? th.how : '';
  if (!th) {
    const k = peerKey(it);
    const ps = k ? (peers.get(k) || []).filter((o) => o.id !== it.id) : [];
    if (ps.length) {
      const ws = ps.map((o) => o.weight).sort((a, b) => a - b);
      th = { w: ws[Math.floor(ws.length / 2)] };
      how = `同じ規格の他の行（${ps.map((o) => `${o.supplier}${o.weight}kg`).join('／')}）`;
    }
  }
  if (w == null || !th || !th.w) { undecidable.push({ it, why: w == null ? '登録重量が空' : '規格を読み取れない' }); continue; }
  const diff = (w - th.w) / th.w * 100;
  const ratio = w / th.w;
  const near = [2, 3, 5, 10, 0.5, 1 / 3, 0.2, 0.1].find((r) => Math.abs(ratio - r) / r < 0.06);
  rows.push({ it, w, th: th.w, diff, ratio, near, how, use: useOf(it) });
}
const hits = rows.filter((r) => Math.abs(r.diff) >= 20).sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff));
const liveHits = hits.filter((r) => !r.it.discontinued);
const stopHits = hits.filter((r) => r.it.discontinued);

const T = (r) => [r.it.name, r.it.supplier || '', r.w, Math.round(r.th * 100) / 100,
  Math.round(r.diff * 10) / 10, Math.round(r.ratio * 100) / 100,
  r.near ? `★${r.near === 1 / 3 ? '1/3' : r.near}倍` : '', r.it.cost, r.it.kgPrice,
  r.it.useCount ?? 0, r.use, r.it.discontinued ? '停止' : '', r.how];
const HEAD = ['品名', '仕入先', '登録重量', '理論重量', 'ズレ%', '倍率', '桁ミスの疑い',
  'cost', 'kgPrice', 'useCount', '使用中の見積件数', 'discontinued', '判定に使った式'];
const tbl = (list) => `<table><tr>${HEAD.map((h) => `<th>${esc(h)}</th>`).join('')}</tr>
${list.map((r) => `<tr class="${r.it.discontinued ? '' : 'live'}">${T(r).map((v, i) => {
  const cls = [2, 3, 4, 5, 7, 8, 9, 10].includes(i) ? 'num' : (i === 12 ? 'small' : '');
  return `<td class="${cls}${i === 6 && v ? ' hit' : ''}">${esc(v)}</td>`;
}).join('')}</tr>`).join('')}</table>`;

document.getElementById('out').innerHTML = `
<table style="width:auto">
<tr><th>項目</th><th>件数</th></tr>
<tr><td>kgPrice を持つ行</td><td class="num">${target.length}</td></tr>
<tr><td>理論重量と比べられた行</td><td class="num">${rows.length}</td></tr>
<tr><td>判定不可</td><td class="num">${undecidable.length}</td></tr>
<tr><td class="hit">ズレ20%以上</td><td class="num">${hits.length}</td></tr>
<tr><td>　うち生きている行</td><td class="num">${liveHits.length}</td></tr>
<tr><td>　うち停止済み</td><td class="num">${stopHits.length}</td></tr>
</table>
<h2>生きている行（優先）— ${liveHits.length}件</h2>
${tbl(liveHits)}
<h2>停止済みの行（参考）— ${stopHits.length}件</h2>
${tbl(stopHits)}
<h2>判定不可 — ${undecidable.length}件</h2>
<pre>${esc(undecidable.map((u) => `${u.it.name}【${u.it.supplier}】… ${u.why}`).join('\n'))}</pre>
<h2>貼り付け用（TSV）</h2>
<pre id="tsv">${esc([HEAD.join('\t'), ...liveHits.map((r) => T(r).join('\t')), ...stopHits.map((r) => T(r).join('\t'))].join('\n'))}</pre>`;

window.__W = { rows, hits, liveHits, stopHits, undecidable: undecidable.length, target: target.length };
</script>
</body>
</html>
